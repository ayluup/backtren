<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Tester</title>
    <style>
      :root {
        --bg: #07111f;
        --bg-soft: #0b1220;
        --panel: #111a2e;
        --panel-soft: #17213d;
        --panel-light: #202b4f;
        --text: #edf7ff;
        --muted: #aebbd0;
        --muted-soft: #8ca0bd;
        --line: rgba(230, 245, 255, 0.12);
        --accent: #7dd3fc;
        --accent-strong: #38bdf8;
        --accent-2: #a78bfa;
        --success: #4ade80;
        --danger: #fb7185;
        --warning: #fbbf24;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", "Segoe UI", Arial, Helvetica, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 80% 10%, rgba(124, 58, 237, 0.25), transparent 20%),
          radial-gradient(circle at 10% 90%, rgba(56, 189, 248, 0.20), transparent 20%),
          linear-gradient(135deg, var(--bg), var(--bg-soft));
        min-height: 100vh;
        padding: 30px 16px;
      }

      .container {
        max-width: 1180px;
        margin: 0 auto;
        background: rgba(17, 24, 39, 0.82);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 24px 60px var(--shadow);
        backdrop-filter: blur(10px);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-icon {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent-strong), var(--accent-2));
        color: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 900;
      }

      h1 {
        margin: 0 0 4px 0;
        font-size: clamp(30px, 3vw, 42px);
        line-height: 1.2;
        letter-spacing: -0.04em;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--text);
        background: var(--panel-soft);
        font-size: 0.82rem;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(380px, 1.05fr) minmax(380px, 1.15fr);
        gap: 18px;
        align-items: stretch;
      }

      .left-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
      }

      .card-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .card-title h2 {
        margin: 0;
        font-size: 1.12rem;
        color: var(--text);
      }

      .card-title span {
        color: var(--muted-soft);
        font-size: 0.82rem;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 12px 0;
      }

      label {
        display: block;
        font-size: 0.84rem;
        margin-bottom: 7px;
        color: var(--muted);
        letter-spacing: 0.02em;
      }

      input,
      select,
      textarea,
      button {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 11px 12px;
        font-size: 0.95rem;
        font-family: inherit;
        outline: none;
      }

      input,
      select,
      textarea {
        background: var(--panel-soft);
        color: var(--text);
      }

      input::placeholder,
      textarea::placeholder {
        color: var(--muted-soft);
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(125, 211, 252, 0.2);
      }

      textarea {
        min-height: 140px;
        resize: vertical;
        background: var(--panel-soft);
      }

      button {
        cursor: pointer;
        font-weight: 800;
        border: none;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #07111f;
        transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
      }

      button:hover {
        filter: brightness(1.08);
        box-shadow: 0 10px 24px rgba(56, 189, 248, 0.25);
      }

      .btn-secondary {
        background: var(--panel-light);
        color: var(--text);
        border: 1px solid var(--line);
      }

      .btn-danger {
        background: var(--danger);
        color: #fff;
      }

      .button-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      .button-row button {
        flex: 1;
      }

      .token-box {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .token-box textarea {
        min-height: 90px;
        margin-top: 10px;
        color: var(--muted);
        font-family: "Courier New", Courier, monospace;
      }

      .chip-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 16px 0 10px;
      }

      .chip {
        background: linear-gradient(135deg, var(--panel-soft), var(--panel-light));
        color: var(--text);
        border: 1px solid var(--line);
        padding: 10px 12px;
        border-radius: 14px;
        cursor: pointer;
        font-size: 0.88rem;
        text-align: left;
        transition: border-color 180ms ease, transform 180ms ease;
      }

      .chip:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }

      .chip strong {
        display: block;
        margin-bottom: 3px;
        color: var(--text);
      }

      .chip small {
        color: var(--muted-soft);
      }

      .result {
        white-space: pre-wrap;
        word-break: break-word;
        background: #020617;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        min-height: 260px;
        color: #dbeafe;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.88rem;
        overflow: auto;
      }

      .status {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.78rem;
        margin-bottom: 10px;
        color: var(--text);
        background: var(--panel-light);
      }

      .ok {
        background: rgba(74, 222, 128, 0.17);
        color: var(--success);
      }

      .err {
        background: rgba(251, 113, 133, 0.16);
        color: var(--danger);
      }

      .status-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
      }

      @media (max-width: 860px) {
        .grid { grid-template-columns: 1fr; }
        .topbar { align-items: flex-start; flex-direction: column; }
        .row { grid-template-columns: 1fr; }
        .chip-list { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div class="brand">
          <div class="brand-icon">API</div>
          <div>
            <h1>Academic API Console</h1>
            <p class="subtitle">Panel de pruebas y autenticación</p>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="pill">Express · JWT</span>
          <span class="pill">v1.0</span>
        </div>
      </div>

      <div class="grid">
        <div class="left-stack">
          <section class="card">
            <div class="card-title">
              <h2>Login</h2>
              <span>Cuenta de acceso</span>
            </div>

            <form id="loginForm">
              <div class="row">
                <div>
                  <label for="loginEmail">Email</label>
                  <input id="loginEmail" name="loginEmail" type="email" placeholder="email@ejemplo.com" required />
                </div>
                <div>
                  <label for="loginPassword">Contraseña</label>
                  <input id="loginPassword" name="loginPassword" type="password" placeholder="********" required />
                </div>
              </div>

              <div class="button-row">
                <button type="submit">Iniciar sesión</button>
                <button type="button" class="btn-danger" id="logoutButton">Cerrar sesión</button>
              </div>

              <div class="token-box">
                <div id="tokenInfo">Token no disponible</div>
                <label for="tokenValue">Token JWT</label>
                <textarea id="tokenValue" readonly>No hay token</textarea>
              </div>
            </form>
          </section>

          <section class="card">
            <div class="card-title">
              <h2>Acciones rápidas</h2>
              <span>Endpoints</span>
            </div>
            <div class="chip-list" id="quickActions"></div>
          </section>
        </div>

        <section class="card">
          <div class="card-title">
            <h2>Petición HTTP</h2>
            <span>API Tester</span>
          </div>

          <form id="requestForm">
            <div class="row">
              <div>
                <label for="method">Método</label>
                <select id="method" name="method">
                  <option value="GET">GET</option>
                  <option value="POST">POST</option>
                  <option value="PUT">PUT</option>
                  <option value="DELETE">DELETE</option>
                </select>
              </div>
              <div>
                <label for="endpoint">Endpoint</label>
                <input id="endpoint" name="endpoint" placeholder="/api/users" value="/api/health" required />
              </div>
            </div>

            <label for="body">Body (JSON)</label>
            <textarea id="body" name="body" placeholder='{"name":"Ejemplo"}'></textarea>

            <div class="button-row">
              <button type="submit">Enviar petición</button>
              <button type="button" class="btn-secondary" id="clearButton">Limpiar</button>
            </div>

            <div class="status-bar">
              <div id="status" class="status">Esperando petición...</div>
            </div>
            <div id="response" class="result">Aquí verás la respuesta del servidor.</div>
          </form>
        </section>
      </div>
    </div>

    <script>
      const quickActions = [
        { label: 'Ver usuarios', method: 'GET', endpoint: '/api/users', body: '' },
        { label: 'Crear profesor', method: 'POST', endpoint: '/api/users', body: '{"name":"Profesor","email":"profesor@test.com","password":"1234","role":"PROFESSOR"}' },
        { label: 'Crear alumno', method: 'POST', endpoint: '/api/users', body: '{"name":"Ana","email":"ana@test.com","password":"1234","role":"STUDENT"}' },
        { label: 'Ver materias', method: 'GET', endpoint: '/api/subjects', body: '' },
        { label: 'Crear materia', method: 'POST', endpoint: '/api/subjects', body: '{"name":"Matemáticas","description":"Clase de matemáticas","professor_id":2}' },
        { label: 'Ver inscripciones', method: 'GET', endpoint: '/api/enrollments', body: '' },
        { label: 'Crear inscripción', method: 'POST', endpoint: '/api/enrollments', body: '{"student_id":2,"subject_id":1,"grade":10}' }
      ];

      const actionsContainer = document.getElementById('quickActions');
      quickActions.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip';
        btn.innerHTML = `<strong>${item.label}</strong><small>${item.method} ${item.endpoint}</small>`;
        btn.addEventListener('click', () => {
          document.getElementById('method').value = item.method;
          document.getElementById('endpoint').value = item.endpoint;
          document.getElementById('body').value = item.body || '';
        });
        actionsContainer.appendChild(btn);
      });

      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const tokenInfo = document.getElementById('tokenInfo');

        if (!email || !password) {
          tokenInfo.textContent = 'Completa email y contraseña.';
          return;
        }

        try {
          const response = await fetch('/api/users/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
          });

          const data = await response.json();

          if (!response.ok) {
            tokenInfo.textContent = data.message || 'Error de login';
            tokenInfo.style.color = 'var(--danger)';
            document.getElementById('tokenValue').value = '';
            return;
          }

          const token = data.token;
          localStorage.setItem('apiToken', token);
          tokenInfo.textContent = 'Login exitoso. Token guardado en localStorage.';
          tokenInfo.style.color = 'var(--success)';
          document.getElementById('tokenValue').value = token;
        } catch (error) {
          tokenInfo.textContent = error.message;
          tokenInfo.style.color = 'var(--danger)';
          document.getElementById('tokenValue').value = '';
        }
      });

      document.getElementById('logoutButton').addEventListener('click', () => {
        localStorage.removeItem('apiToken');
        document.getElementById('tokenInfo').textContent = 'Sesión cerrada. Token eliminado.';
        document.getElementById('tokenInfo').style.color = 'var(--muted)';
        document.getElementById('tokenValue').value = '';
      });

      document.getElementById('clearButton').addEventListener('click', () => {
        document.getElementById('method').value = 'GET';
        document.getElementById('endpoint').value = '/api/health';
        document.getElementById('body').value = '';
        document.getElementById('status').textContent = 'Esperando petición...';
        document.getElementById('status').className = 'status';
        document.getElementById('response').textContent = 'Aquí verás la respuesta del servidor.';
      });

      document.getElementById('requestForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        const method = document.getElementById('method').value;
        const rawEndpoint = document.getElementById('endpoint').value.trim();
        const body = document.getElementById('body').value.trim();

        const statusEl = document.getElementById('status');
        const responseEl = document.getElementById('response');

        if (!rawEndpoint) {
          statusEl.textContent = 'Debes indicar un endpoint';
          statusEl.className = 'status err';
          responseEl.textContent = 'Introduce la ruta del endpoint.';
          return;
        }

        const endpoint = rawEndpoint.startsWith('http')
          ? rawEndpoint
          : rawEndpoint.startsWith('/')
            ? rawEndpoint
            : `/${rawEndpoint}`;

        const url = endpoint.startsWith('http') ? endpoint : new URL(endpoint, window.location.origin).toString();

        const headers = {
          'Content-Type': 'application/json'
        };

        const storedToken = localStorage.getItem('apiToken');
        if (storedToken) {
          headers.Authorization = `Bearer ${storedToken}`;
        }

        const options = {
          method,
          headers,
        };

        if (body && method !== 'GET') {
          options.body = body;
        }

        try {
          const response = await fetch(url, options);
          const text = await response.text();
          let displayText = text;

          try {
            const parsed = JSON.parse(text);
            displayText = JSON.stringify(parsed, null, 2);
          } catch (e) {
            displayText = text;
          }

          if (!response.ok && text.includes('Cannot GET')) {
            displayText = `No se pudo completar la petición (${response.status}). Verifica que el servidor esté corriendo en http://localhost:3000 y que la ruta sea correcta.`;
          }

          statusEl.textContent = `${response.status} ${response.statusText}`;
          statusEl.className = `status ${response.ok ? 'ok' : 'err'}`;
          responseEl.textContent = displayText;
        } catch (error) {
          statusEl.textContent = 'Error';
          statusEl.className = 'status err';
          responseEl.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
